<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eaf6;background:#0d0f1f;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;gap:4px;align-items:flex-end;padding:8px 8px 0;background:#090b18;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;max-width:210px;min-width:110px;padding:8px 10px 8px 14px;border-radius:10px 10px 0 0;background:#12152b;color:#9aa3d6;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:#1b1f3d;color:#fff}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab b{font-weight:400;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%}
.tab b:hover{background:#ffffff22}
#plus{border:0;background:none;color:#9aa3d6;font-size:20px;width:34px;height:32px;cursor:pointer;border-radius:8px}
#plus:hover{background:#171a33}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#1b1f3d;flex:none}
.nav{width:34px;height:34px;border:0;border-radius:50%;background:none;color:#cdd3ff;font-size:16px;cursor:pointer;flex:none}
.nav:hover{background:#2b305a}
form{display:flex;background:#0d0f1f;border:1px solid #2d3260;border-radius:999px;padding:4px}
form:focus-within{border-color:#8ab4ff}
#bf{flex:1}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font-size:.95rem;padding:8px 16px}
.go{border:0;border-radius:999px;padding:0 22px;font-weight:700;cursor:pointer;color:#0d0f1f;background:linear-gradient(90deg,#8ab4ff,#c58bff)}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;background:#fff;display:none}
.view.nav-on iframe{display:block}
.view.nav-on .home{display:none}
.home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 20%,#2b2f77 0,#0d0f1f 55%)}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#8ab4ff,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:8px 0 26px;color:#9aa3d6}
.hf{width:min(640px,100%);box-shadow:0 10px 40px #0008;background:#171a33}
.hf input{font-size:1.05rem;padding:12px 20px}
.quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;max-width:640px}
.quick a{padding:9px 18px;border-radius:999px;background:#171a33;border:1px solid #2d3260;color:#cdd3ff;text-decoration:none;font-size:.95rem}
.quick a:hover{border-color:#8ab4ff}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3a1620;color:#ffb4b4;border:1px solid #7a2c3d;padding:10px 18px;border-radius:12px;display:none;max-width:90vw;z-index:9}
</style>
</head>
<body>
<div id="tabs"><button id="plus" title="New tab">+</button></div>
<div id="bar">
  <button class="nav" id="back" title="Back">&#8592;</button>
  <button class="nav" id="fwd" title="Forward">&#8594;</button>
  <button class="nav" id="reload" title="Reload">&#8635;</button>
  <button class="nav" id="home-btn" title="Home">&#8962;</button>
  <form id="bf"><input id="bq" placeholder="Search or enter a URL" autocomplete="off"><button class="go">Go</button></form>
</div>
<div id="views"></div>
<div id="msg"></div>

<template id="tpl">
  <div class="view">
    <div class="home">
      <h1>Portal</h1>
      <p class="sub">Search anything or enter a link.</p>
      <form class="hf"><input placeholder="Search or enter a URL" autocomplete="off"><button class="go">Go</button></form>
      <div class="quick">
        <a href="#" data-u="https://www.youtube.com">YouTube</a>
        <a href="#" data-u="https://www.reddit.com">Reddit</a>
        <a href="#" data-u="https://www.wikipedia.org">Wikipedia</a>
        <a href="#" data-u="https://duckduckgo.com">Search</a>
      </div>
    </div>
    <iframe></iframe>
  </div>
</template>

<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var ready = null, scramjet = null, tabs = [], active = null;

function toUrl(v) {
  v = v.trim();
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(v)) return 'https://' + v;
  return 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
}
function say(t) {
  var m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(say.t); say.t = setTimeout(function () { m.style.display = 'none'; }, 8000);
}

async function setup() {
  if (!('serviceWorker' in navigator)) throw new Error('Service workers are not available. Open the site over https.');
  var sj = $scramjetLoadController();
  var files = { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' };
  scramjet = new sj.ScramjetController({ prefix: '/~/sj/', files: files, wasm: files.wasm, all: files.all, sync: files.sync });
  await navigator.serviceWorker.register('/sw.js', { scope: '/' });
  await navigator.serviceWorker.ready;
  await scramjet.init();

  var conn = new BareMux.BareMuxConnection('/baremux/worker.js');
  var wisp = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
  var want = new URLSearchParams(location.search).get('transport');
  var useCurl = want !== 'epoxy';
  if (useCurl) {
    try { useCurl = (await fetch('/libcurl/index.mjs', { method: 'HEAD' })).ok; } catch (e) { useCurl = false; }
  }
  var path = useCurl ? '/libcurl/index.mjs' : '/epoxy/index.mjs';
  if ((await conn.getTransport()) !== path) await conn.setTransport(path, [{ wisp: wisp }]);
}

function select(t) {
  active = t;
  tabs.forEach(function (x) {
    x.view.classList.toggle('on', x === t);
    x.el.classList.toggle('on', x === t);
  });
  $('bq').value = t.url || '';
}

function newTab() {
  var t = { url: '' };
  t.view = $('tpl').content.firstElementChild.cloneNode(true);
  t.frame = t.view.querySelector('iframe');
  t.el = document.createElement('div');
  t.el.className = 'tab';
  t.el.innerHTML = '<span>New Tab</span><b>&times;</b>';
  t.el.onclick = function () { select(t); };
  t.el.querySelector('b').onclick = function (e) { e.stopPropagation(); closeTab(t); };
  $('tabs').insertBefore(t.el, $('plus'));
  $('views').appendChild(t.view);

  var hq = t.view.querySelector('.hf input');
  t.view.querySelector('.hf').onsubmit = function (e) { e.preventDefault(); go(hq.value, t); };
  t.view.querySelectorAll('.quick a').forEach(function (a) {
    a.onclick = function (e) { e.preventDefault(); go(a.dataset.u, t); };
  });
  t.frame.onload = function () {
    try {
      var h = t.frame.contentWindow.location.href;
      if (scramjet && typeof scramjet.decodeUrl === 'function' && h.indexOf('/~/sj/') !== -1) {
        t.url = scramjet.decodeUrl(h);
        if (active === t) $('bq').value = t.url;
      }
      var title = t.frame.contentDocument.title;
      if (title) t.el.firstChild.textContent = title;
    } catch (e) {}
  };
  tabs.push(t);
  select(t);
  hq.focus();
}

function closeTab(t) {
  var i = tabs.indexOf(t);
  tabs.splice(i, 1);
  t.el.remove(); t.view.remove();
  if (!tabs.length) newTab();
  else if (active === t) select(tabs[Math.max(0, i - 1)]);
}

async function go(v, t) {
  t = t || active;
  if (!v || !v.trim()) return;
  try {
    if (!ready) ready = setup();
    await ready;
  } catch (e) {
    ready = null;
    say('Could not start the proxy: ' + (e && e.message ? e.message : e));
    return;
  }
  var url = toUrl(v);
  t.url = url;
  t.view.classList.add('nav-on');
  t.el.firstChild.textContent = url;
  if (active === t) $('bq').value = url;
  t.frame.src = scramjet.encodeUrl(url);
}

$('plus').onclick = newTab;
$('bf').onsubmit = function (e) { e.preventDefault(); go($('bq').value); };
$('back').onclick = function () { try { active.frame.contentWindow.history.back(); } catch (e) {} };
$('fwd').onclick = function () { try { active.frame.contentWindow.history.forward(); } catch (e) {} };
$('reload').onclick = function () { try { active.frame.contentWindow.location.reload(); } catch (e) {} };
$('home-btn').onclick = function () {
  active.frame.src = 'about:blank'; active.view.classList.remove('nav-on');
  active.url = ''; active.el.firstChild.textContent = 'New Tab'; $('bq').value = '';
};
window.addEventListener('error', function (e) { say('Error: ' + e.message); });
newTab();
</script>
</body>
</html>
